services:
  - type: web
    name: multi-language-translator-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: TRANSLATION_PROVIDER
        value: google
      - key: CORS_ORIGINS
        value: "*"
